name: Build and Publish APK

on:
  push:
    branches:
      - BvbValanchery
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for mobile
        run: npm run build:mobile

      - name: Copy web assets to Android
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Build Android debug APK
        working-directory: android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudentElectionVotingSystem-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK Build
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Auto-generated installable debug APK from branch BvbValanchery.
            This release is updated on every push.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
